<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binjeru – Japanisch lernen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-jp">日本語</span> Binjeru</div>
    <nav class="tabs" id="tabs">
      <button data-view="home" class="active">Start</button>
      <button data-view="table">Kana-Tabelle</button>
      <button data-view="kanaquiz">Kana-Quiz</button>
      <button data-view="cards">Karteikarten</button>
      <button data-view="vocabquiz">Vokabel-Quiz</button>
    </nav>
  </header>

  <main>
    <!-- Start -->
    <section id="view-home" class="view active">
      <h1>ようこそ! <small>Willkommen</small></h1>
      <p class="lead">Lerne Hiragana, Katakana und erste Vokabeln. Dein Fortschritt wird im Browser gespeichert.</p>
      <div class="stats" id="stats"></div>
      <div class="cards-grid">
        <button class="feature" data-goto="table"><span class="f-icon">あ</span><b>Kana-Tabelle</b><span>Alle Zeichen ansehen und anhören</span></button>
        <button class="feature" data-goto="kanaquiz"><span class="f-icon">ア</span><b>Kana-Quiz</b><span>Zeichen erkennen – Auswahl oder Eintippen</span></button>
        <button class="feature" data-goto="cards"><span class="f-icon">語</span><b>Karteikarten</b><span>Vokabeln mit Lernboxen wiederholen</span></button>
        <button class="feature" data-goto="vocabquiz"><span class="f-icon">？</span><b>Vokabel-Quiz</b><span>Bedeutungen abfragen</span></button>
      </div>
      <button class="link-btn" id="reset-progress">Fortschritt zurücksetzen</button>
    </section>

    <!-- Kana-Tabelle -->
    <section id="view-table" class="view">
      <div class="toolbar">
        <div class="segmented" id="table-script">
          <button data-script="hira" class="active">Hiragana</button>
          <button data-script="kata">Katakana</button>
        </div>
        <span class="hint">Klicke auf ein Zeichen, um es zu hören. Die Farbe zeigt deinen Lernstand.</span>
      </div>
      <div id="kana-table"></div>
    </section>

    <!-- Kana-Quiz -->
    <section id="view-kanaquiz" class="view">
      <div class="panel" id="kq-setup">
        <h2>Kana-Quiz</h2>
        <div class="field">
          <label>Schrift</label>
          <div class="segmented" id="kq-script">
            <button data-v="hira" class="active">Hiragana</button>
            <button data-v="kata">Katakana</button>
            <button data-v="both">Beide</button>
          </div>
        </div>
        <div class="field">
          <label>Zeichengruppen</label>
          <div class="checks" id="kq-groups"></div>
        </div>
        <div class="field">
          <label>Modus</label>
          <div class="segmented" id="kq-mode">
            <button data-v="choice" class="active">Auswahl</button>
            <button data-v="type">Romaji eintippen</button>
            <button data-v="reverse">Romaji → Kana</button>
          </div>
        </div>
        <div class="field">
          <label>Anzahl Fragen</label>
          <div class="segmented" id="kq-count">
            <button data-v="10">10</button>
            <button data-v="20" class="active">20</button>
            <button data-v="50">50</button>
          </div>
        </div>
        <button class="primary" id="kq-start">Quiz starten</button>
      </div>

      <div class="panel hidden" id="kq-play">
        <div class="progress"><div class="progress-bar" id="kq-bar"></div></div>
        <div class="quiz-meta"><span id="kq-pos"></span><span id="kq-score"></span></div>
        <div class="big-char" id="kq-question"></div>
        <div class="choices" id="kq-choices"></div>
        <form id="kq-form" class="type-form hidden" autocomplete="off">
          <input id="kq-input" type="text" placeholder="z. B. ka" autocapitalize="off" spellcheck="false">
          <button class="primary" type="submit">Prüfen</button>
        </form>
        <div class="feedback" id="kq-feedback"></div>
        <button class="primary hidden" id="kq-next">Weiter ⏎</button>
      </div>

      <div class="panel hidden" id="kq-result"></div>
    </section>

    <!-- Karteikarten -->
    <section id="view-cards" class="view">
      <div class="toolbar">
        <select id="fc-cat"></select>
        <div class="segmented" id="fc-dir">
          <button data-v="jp" class="active">Japanisch → Deutsch</button>
          <button data-v="de">Deutsch → Japanisch</button>
        </div>
      </div>
      <div class="boxes" id="fc-boxes"></div>
      <div class="flashcard" id="flashcard" tabindex="0">
        <div class="fc-inner">
          <div class="fc-face fc-front" id="fc-front"></div>
          <div class="fc-face fc-back" id="fc-back"></div>
        </div>
      </div>
      <p class="hint center">Karte anklicken oder Leertaste zum Umdrehen</p>
      <div class="fc-actions">
        <button class="bad" id="fc-wrong">✗ Nicht gewusst <kbd>1</kbd></button>
        <button class="speak" id="fc-speak">🔊 Anhören</button>
        <button class="good" id="fc-right">✓ Gewusst <kbd>2</kbd></button>
      </div>
    </section>

    <!-- Vokabel-Quiz -->
    <section id="view-vocabquiz" class="view">
      <div class="panel" id="vq-setup">
        <h2>Vokabel-Quiz</h2>
        <div class="field">
          <label>Kategorie</label>
          <select id="vq-cat"></select>
        </div>
        <div class="field">
          <label>Richtung</label>
          <div class="segmented" id="vq-dir">
            <button data-v="jp" class="active">Japanisch → Deutsch</button>
            <button data-v="de">Deutsch → Japanisch</button>
          </div>
        </div>
        <button class="primary" id="vq-start">Quiz starten</button>
      </div>
      <div class="panel hidden" id="vq-play">
        <div class="progress"><div class="progress-bar" id="vq-bar"></div></div>
        <div class="quiz-meta"><span id="vq-pos"></span><span id="vq-score"></span></div>
        <div class="vq-question" id="vq-question"></div>
        <div class="choices wide" id="vq-choices"></div>
        <div class="feedback" id="vq-feedback"></div>
        <button class="primary hidden" id="vq-next">Weiter ⏎</button>
      </div>
      <div class="panel hidden" id="vq-result"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
